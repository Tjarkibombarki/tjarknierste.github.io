<!DOCTYPE html>

<head>

<title>Tjark — Tischler in Ausbildung</title>
<style>

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    color: #111111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;

    margin: 1.5rem 0;

    display: flex;

  .links a {

    text-decoration: none;

    border-bottom: 1px solid #111111;
    padding-bottom: 2px;
  }

  .links a:hover,
  .links a:focus-visible {
    color: #777777;
    border-color: #777777;
  }

  footer {

    bottom: 1.5rem;
    font-size: 0.75rem;

  }
